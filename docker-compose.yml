version: '3.8'

networks:
  rag-network:
    driver: bridge

volumes:
  n8n_data:
  qdrant_data:
  ollama_data:

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/data/pdfs
    volumes:
      - n8n_data:/home/node/.n8n
      - ./pdfs:/data/pdfs
    networks:
      - rag-network

  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - rag-network

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    restart: always
    ports:
      - "11235:11235"
    environment:
      - CRAWL4AI_API_TOKEN=local_secret_token_123
    networks:
      - rag-network

  docling:
    image: quay.io/docling-project/docling-serve:latest
    container_name: docling
    restart: always
    ports:
      - "5001:5001"
    environment:
      - DOCLING_SERVE_MAX_SYNC_WAIT=600
    networks:
      - rag-network
